name: Firmware build

on:
  pull_request:
    paths:
      - CMakeLists.txt
      - dependencies.lock
      - partitions.csv
      - partitions_v2.csv
      - sdkconfig.defaults
      - sdkconfig.v2.defaults
      - sdkconfig.v2.lab.defaults
      - scripts/test_v2_gpio7_experiment.py
      - main/**
      - components/**
      - tests/check_dc_ui_pin.py
      - tests/test_dragon_core_source_policy.py
      - tests/check_http_diagnostics.py
      - docs/HTTP_DIAGNOSTICS.md
      - tests/check_events_route.py
      - tests/check_power_recovery.mjs
      - config/dragon_core_fork_pins.json
      - docs/DRAGON_CORE_DEPENDENCIES.md
      - .github/workflows/firmware-build.yml
      - .github/workflows/release.yml
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - dependencies.lock
      - partitions.csv
      - sdkconfig.defaults
      - main/**
      - components/**
      - tests/check_dc_ui_pin.py
      - tests/test_dragon_core_source_policy.py
      - tests/check_http_diagnostics.py
      - docs/HTTP_DIAGNOSTICS.md
      - tests/check_events_route.py
      - tests/check_power_recovery.mjs
      - config/dragon_core_fork_pins.json
      - docs/DRAGON_CORE_DEPENDENCIES.md
      - .github/workflows/firmware-build.yml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esp32c2:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Validate dragon-core provenance and locked pins
        run: |
          python3 tests/check_dc_ui_pin.py
          python3 -m unittest discover -s tests -p 'test_dragon_core_source_policy.py' -v

      - name: Check unsupported events route contract
        run: python3 tests/check_events_route.py

      - name: Check DragonPWR recovery UI behavior
        run: node tests/check_power_recovery.mjs

      - name: Check HTTP session diagnostics invariants
        run: python3 tests/check_http_diagnostics.py

      - name: Build ESP32-C2 firmware with ESP-IDF 5.3.5
        run: |
          docker run --rm             -v "$GITHUB_WORKSPACE:/work"             -w /work             espressif/idf:v5.3.5             bash -lc '
              set -euo pipefail
              git config --global --add safe.directory /work
              idf.py -D IDF_TARGET=esp32c2 build
              idf.py size
              idf.py merge-bin
            '

      - name: Assert C2 dependency lock is reproducible
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- dependencies.lock

      - name: Verify merged full-flash image
        shell: bash
        run: |
          set -euo pipefail
          test -f build/merged-binary.bin

      - name: Upload flashable build outputs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dragonpwr-esp32c2
          if-no-files-found: error
          path: |
            build/dragonpwr.bin
            build/merged-binary.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/flasher_args.json
            build/flash_args

  esp32c3-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Validate dragon-core provenance and locked pins
        run: |
          python3 tests/check_dc_ui_pin.py
          python3 -m unittest discover -s tests -p 'test_dragon_core_source_policy.py' -v

      - name: Host test experimental GPIO7 facility (no GPIO access)
        run: python3 scripts/test_v2_gpio7_experiment.py

      - name: Build V2 ESP32-C3 with ESP-IDF 5.3.5
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            espressif/idf:v5.3.5 \
            bash -lc '
              set -euo pipefail
              git config --global --add safe.directory /work
              idf.py -B build-v2 -D SDKCONFIG=sdkconfig.v2 -D SDKCONFIG_DEFAULTS=sdkconfig.v2.defaults set-target esp32c3
              idf.py -B build-v2 -D SDKCONFIG=sdkconfig.v2 -D SDKCONFIG_DEFAULTS=sdkconfig.v2.defaults build
              idf.py -B build-v2 size
              grep -q "^CONFIG_IDF_TARGET=\"esp32c3\"$" sdkconfig.v2
              grep -q "^CONFIG_XTAL_FREQ_40=y$" sdkconfig.v2
              grep -q "^CONFIG_PARTITION_TABLE_CUSTOM_FILENAME=\"partitions_v2.csv\"$" sdkconfig.v2
              grep -q "^CONFIG_ESPTOOLPY_FLASHSIZE=\"4MB\"$" sdkconfig.v2
              test "$(stat -c%s build-v2/dragonpwr.bin)" -le 2031616
              ! grep -q "^CONFIG_DP_V2_GPIO7_EXPERIMENT=y$" sdkconfig.v2 || exit 1
              ! grep -q "dp_v2_gpio7_experiment.c" build-v2/compile_commands.json || exit 1
            '

      - name: Assert inactive V2 hardware is selected
        shell: bash
        run: |
          set -euo pipefail
          test -f build-v2/dragonpwr.elf
          grep -q 'dp_relay_v2_inactive.c' build-v2/compile_commands.json
          grep -q 'dp_button_v2_inactive.c' build-v2/compile_commands.json
          ! grep -Eq '/dp_relay/dp_relay.c[" ]' build-v2/compile_commands.json
          ! grep -Eq '/dp_button/dp_button.c[" ]' build-v2/compile_commands.json

      - name: Upload V2 C3 firmware build outputs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dragonpwr-esp32c3-v2
          if-no-files-found: error
          path: |
            build-v2/dragonpwr.bin
            build-v2/bootloader/bootloader.bin
            build-v2/partition_table/partition-table.bin
            build-v2/ota_data_initial.bin
            build-v2/flasher_args.json
            build-v2/flash_args


  esp32c3-v2-lab:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Verify GPIO7 lab driver under host mocks
        run: python3 scripts/test_v2_gpio7_experiment.py

      - name: Build explicitly opt-in C3 experimental image (not a release)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            espressif/idf:v5.3.5 \
            bash -lc '
              set -euo pipefail
              git config --global --add safe.directory /work
              idf.py -B build-v2-lab -D SDKCONFIG=sdkconfig.v2.lab -D SDKCONFIG_DEFAULTS=sdkconfig.v2.lab.defaults set-target esp32c3
              idf.py -B build-v2-lab -D SDKCONFIG=sdkconfig.v2.lab -D SDKCONFIG_DEFAULTS=sdkconfig.v2.lab.defaults build
              grep -q "^CONFIG_DP_V2_GPIO7_EXPERIMENT=y$" sdkconfig.v2.lab
              grep -q "^CONFIG_IDF_TARGET=\"esp32c3\"$" sdkconfig.v2.lab
              grep -q "dp_v2_gpio7_experiment.c" build-v2-lab/compile_commands.json
              grep -q "dp_relay_v2_inactive.c" build-v2-lab/compile_commands.json
              test "$(stat -c%s build-v2-lab/dragonpwr.bin)" -le 2031616
            '

      - name: Label experimental candidate (not firmware release)
        run: |
          echo "EXPERIMENTAL / C3 GPIO7 / DO NOT DEPLOY UNATTENDED / NOT ELECTRICALLY QUALIFIED" > EXPERIMENTAL-NOT-RELEASE.txt

      - name: Upload review-only experimental image
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dragonpwr-esp32c3-v2-gpio7-experimental
          if-no-files-found: error
          path: |
            EXPERIMENTAL-NOT-RELEASE.txt
            build-v2-lab/dragonpwr.bin
            build-v2-lab/dragonpwr.elf
            build-v2-lab/bootloader/bootloader.bin
            build-v2-lab/partition_table/partition-table.bin
            build-v2-lab/ota_data_initial.bin
            build-v2-lab/flasher_args.json
            sdkconfig.v2.lab
 sdkconfig.v2
              grep -q "^CONFIG_XTAL_FREQ_40=y$" sdkconfig.v2
              grep -q "^CONFIG_PARTITION_TABLE_CUSTOM_FILENAME=\"partitions_v2.csv\"$" sdkconfig.v2
              grep -q "^CONFIG_ESPTOOLPY_FLASHSIZE=\"4MB\"$" sdkconfig.v2
              test "$(stat -c%s build-v2/dragonpwr.bin)" -le 2031616
              ! grep -q "^CONFIG_DP_V2_GPIO7_EXPERIMENT=y$" sdkconfig.v2
              ! grep -q "dp_v2_gpio7_experiment.c" build-v2/compile_commands.json
            '

      - name: Assert inactive V2 hardware is selected
        shell: bash
        run: |
          set -euo pipefail
          test -f build-v2/dragonpwr.elf
          grep -q 'dp_relay_v2_inactive.c' build-v2/compile_commands.json
          grep -q 'dp_button_v2_inactive.c' build-v2/compile_commands.json
          ! grep -Eq '/dp_relay/dp_relay.c[" ]' build-v2/compile_commands.json
          ! grep -Eq '/dp_button/dp_button.c[" ]' build-v2/compile_commands.json

      - name: Upload V2 C3 firmware build outputs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dragonpwr-esp32c3-v2
          if-no-files-found: error
          path: |
            build-v2/dragonpwr.bin
            build-v2/bootloader/bootloader.bin
            build-v2/partition_table/partition-table.bin
            build-v2/ota_data_initial.bin
            build-v2/flasher_args.json
            build-v2/flash_args


