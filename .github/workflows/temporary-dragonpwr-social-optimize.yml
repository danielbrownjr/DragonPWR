name: Temporary DragonPWR social image optimization

on:
  push:
    branches: [docs/dragonpwr-branding]

permissions:
  contents: write

jobs:
  optimize:
    if: "github.event.head_commit.message == 'chore(branding): run one-time social preview optimizer'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branding branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: docs/dragonpwr-branding
          persist-credentials: true

      - name: Install pinned Pillow in isolated environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/dragonpwr-image-opt
          /tmp/dragonpwr-image-opt/bin/pip install --disable-pip-version-check pillow==11.3.0

      - name: Resize and optimize original PNG
        shell: bash
        run: |
          set -euo pipefail
          /tmp/dragonpwr-image-opt/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Path("docs/branding/dragonpwr-social-preview.png")
          with Image.open(source) as original:
              if original.format != "PNG":
                  raise SystemExit("Expected source PNG")
              rgb = original.convert("RGB")
              if rgb.width * 1 != rgb.height * 2:
                  raise SystemExit(f"Expected 2:1 artwork, got {rgb.size}")
              resized = rgb.resize((1280, 640), Image.Resampling.LANCZOS)
              optimized = resized.quantize(colors=128, method=Image.Quantize.MEDIANCUT, dither=Image.Dither.NONE)
              optimized.save(source, format="PNG", optimize=True)
          with Image.open(source) as result:
              result.verify()
          size = source.stat().st_size
          print(f"Optimized {source}: 1280x640, {size} bytes")
          if size >= 1_000_000:
              raise SystemExit("Optimized PNG exceeds 1 MB")
          PY

      - name: Commit verified binary to same PR branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "docs/dragonpwr-branding"
          git add -- docs/branding/dragonpwr-social-preview.png
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only)" = "docs/branding/dragonpwr-social-preview.png"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(branding): optimize social-preview PNG to 1280x640 under 1 MB"
          git push origin HEAD:docs/dragonpwr-branding
